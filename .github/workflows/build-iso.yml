name: GM OS Mobile ISO Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  remaster-iso:
    name: Remasterizar ISO Android-x86
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso p7zip-full e2fsprogs wget imagemagick zip bc

      - name: Executar Script de Remasterização
        run: |
          chmod +x scripts/remaster.sh
          sudo ./scripts/remaster.sh

      - name: Upload da ISO GM OS Mobile
        uses: actions/upload-artifact@v4
        with:
          name: GM-OS-Mobile-ISO
          path: output/GM-OS-Mobile.iso
          retention-days: 7
